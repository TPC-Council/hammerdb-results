name: Publish Leaderboard Prototype

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate artifacts
        run: python tools/validate_result.py

      - name: Build leaderboard
        run: python tools/build_leaderboard.py

      - name: Set publication repository context
        env:
          REPOSITORY: ${{ github.repository }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          owner, repo = os.environ["REPOSITORY"].split("/", 1)
          data = {"owner": owner, "repo": repo, "branch": os.environ["DEPLOY_BRANCH"]}
          Path("site/repository-context.js").write_text(
              "window.HammerDBResultsDeploy = " + json.dumps(data) + ";\n",
              encoding="utf-8",
          )
          PY

      - name: Include result artifacts in Pages site
        run: cp -R results site/results

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
